name: Import Hacker News picks

# When new verdicts land on main (from the scheduled classification task), import every year into
# the production database. Skipped until the DATABASE_URL repository secret exists.
# Optional secret: YOUTUBE_API_KEY, for video lengths.
on:
  push:
    branches: [main]
    paths: ["data/hn/verdicts/**"]
  workflow_dispatch:

concurrency:
  group: hn-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Check for a database
        id: db
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "No DATABASE_URL secret yet; nothing to import into."; echo "ready=false" >> "$GITHUB_OUTPUT";
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: ${{ steps.db.outputs.ready == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.db.outputs.ready == 'true' }}
        with:
          node-version: 22
          cache: npm
      - if: ${{ steps.db.outputs.ready == 'true' }}
        run: npm ci
      - if: ${{ steps.db.outputs.ready == 'true' }}
        run: npm run db:migrate
      - if: ${{ steps.db.outputs.ready == 'true' }}
        run: npx tsx scripts/hn/import.mts --all --concurrency 4
